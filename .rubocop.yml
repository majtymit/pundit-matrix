# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  TargetRubyVersion: 3.2
  TargetRailsVersion: 7.2
  NewCops: disable

# Omakase checks only the layout; these find real mistakes, such as an unused variable.
Lint:
  Enabled: true

Security:
  Enabled: true

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space
  Include:
    - '**/*.rb'

Style/StringLiterals:
  EnforcedStyle: single_quotes
  Include:
    - '**/*.rb'

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma
  Include:
    - '**/*.rb'

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
  Include:
    - '**/*.rb'

Bundler/OrderedGems:
  Enabled: true

# If autocorrection is enabled, the following cops are recommended to further format the broken lines.
# Together, these cops will pretty print hashes, arrays, method calls, etc.

Layout/ArgumentAlignment:
  Enabled: true

Layout/ArrayAlignment:
  Enabled: true

Layout/AssignmentIndentation:
  Enabled: true
  IndentationWidth: 2

Layout/BlockAlignment:
  Enabled: true

Layout/BlockEndNewline:
  Enabled: true

Layout/ClosingParenthesisIndentation:
  Enabled: true

Layout/EndAlignment:
  Enabled: true

Layout/FirstArgumentIndentation:
  Enabled: true

Layout/FirstArrayElementIndentation:
  Enabled: true

Layout/FirstHashElementIndentation:
  Enabled: true

Layout/FirstParameterIndentation:
  Enabled: true

Layout/HashAlignment:
  Enabled: true

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: normal

Layout/IndentationStyle:
  Enabled: true
  EnforcedStyle: spaces

Layout/IndentationWidth:
  Enabled: true
  Width: 2

Layout/LineLength:
  Enabled: true
  Max: 120

Layout/EmptyLines:
  Enabled: true

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/MultilineBlockLayout:
  Enabled: true

Layout/MultilineHashBraceLayout:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/ParameterAlignment:
  Enabled: true

Style/BlockDelimiters:
  Enabled: true
